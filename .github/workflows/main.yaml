name: Puppet Storcli CI/CD

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: docker.io/puppet/pdk:nightly

    steps:
      - uses: actions/checkout@v6

      - name: Validate
        run: pdk validate

      - name: Unit tests
        run: pdk test unit

      - name: Install tools
        run: |
          apt-get update
          apt-get install sed jq -y

      - name: Check same metadata.json and git tag
        id: check-metadata-git-tag
        run: |
          VERSION_METADATA=$(jq -r .version metadata.json)
          VERSION_GIT=$(echo $GITHUB_REF | sed 's/refs\/tags\/v//')
          [ "$VERSION_METADATA" != "$VERSION_GIT" ] && exit 1
          echo "VERSION=$VERSION_METADATA" >> $GITHUB_OUTPUT

      - name: Build
        run: pdk build

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v3
        with:
          name: built-package
          path: ./pkg/trunet-storcli-${{ steps.check-metadata-git-tag.outputs.VERSION }}.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v6

      - name: Download built package
        uses: actions/download-artifact@v3
        with:
          name: built-package

      - name: Create Github Release
        uses: actions/create-release@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Github Release Asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./pkg/trunet-storcli-${{ steps.check-metadata-git-tag.outputs.VERSION }}.tar.gz
          asset_name: trunet-storcli-${{ steps.check-metadata-git-tag.outputs.VERSION }}.tar.gz
          asset_content_type: application/gzip

      - name: Puppet forge release
        env:
          PUPPET_FORGE_APIKEY: ${{ secrets.PUPPET_FORGE_APIKEY }}
        run: |
          curl --fail --silent --max-time 5 --show-error --connect-timeout 5 \
            --request 'POST' \
            --form file="@./pkg/trunet-storcli-${{ steps.check-metadata-git-tag.outputs.VERSION }}.tar.gz" \
            --header 'Content-Type: multipart/form-data' \
            --header "Authorization: Bearer $PUPPET_FORGE_APIKEY" \
            "https://forgeapi.puppet.com/v3/releases"
